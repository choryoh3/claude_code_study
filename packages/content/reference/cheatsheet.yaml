sections:
  - id: slash-commands
    title: スラッシュコマンド
    items:
      - term: /help
        description: ヘルプと、利用できるコマンドの一覧を表示する。コマンドは更新で増減するので、迷ったらここで確認する。
        lesson: slash-commands
      - term: /clear
        description: 空のコンテキストで新しい会話を始める。前の会話は /resume で再開できる。
        lesson: slash-commands
      - term: /compact
        description: 会話を要約してコンテキストを空け、同じ会話を続ける。後ろに「残したい内容」を書いて指定できる。
        lesson: context-management
      - term: /context
        description: コンテキストの使用状況を色付きのグリッドで表示する。CLAUDE.md が読み込まれているかの確認にも使う。
        lesson: context-management
      - term: /resume
        description: 過去の会話を再開する。/clear で始めた新しい会話の前の会話にも戻れる。
        lesson: context-management
      - term: /rewind
        description: 会話やコードを以前の時点まで戻す。方向を誤ったときに使う。
        lesson: context-management
      - term: /model
        description: モデルを切り替える。引数なしで選択画面が開き、選んだモデルは新しいセッションの既定値として保存される。
        lesson: slash-commands
      - term: /status
        description: バージョン、モデル、アカウント、接続状態を表示する。有効な設定の出どころの確認にも使う。
        lesson: slash-commands
      - term: /init
        description: プロジェクト用の CLAUDE.md の下書きを作る。すでにある場合は上書きせず改善案を出す。
        lesson: claude-md
      - term: /memory
        description: CLAUDE.md の場所を確認・編集し、auto memory のオン/オフを切り替える。
        lesson: claude-md
      - term: /permissions
        description: 許可・確認・拒否のルールを一覧し、追加・削除する画面を開く。
        lesson: permission-modes
      - term: /doctor
        description: インストール、設定、コンテキスト使用量などをまとめて診断し、修正案を出す。適用前に確認を求められる。
        lesson: troubleshooting
  - id: shortcuts
    title: キー操作
    items:
      - term: Shift+Tab
        description: 権限モードを切り替える。押すたびに循環し、現在のモードはステータスバーに表示される。
        lesson: permission-modes
      - term: Esc
        description: Claude の応答やツール実行を中断する。それまでの作業は残る。
        lesson: basic-usage
      - term: Esc Esc
        description: 入力欄が空のときに2回押すと、巻き戻しメニューが開く。
        lesson: basic-usage
      - term: Ctrl+C
        description: 実行中なら中断する。何も実行していなければ入力を消去し、2回目で終了する。
        lesson: basic-usage
      - term: Ctrl+D
        description: 2回押すと終了する。/exit でも終了できる。
        lesson: basic-usage
      - term: "\\ + Enter"
        description: 送信せずに改行する。すべての端末で使える。Ctrl+J でも改行できる。
        lesson: basic-usage
      - term: Ctrl+R
        description: コマンド履歴を検索する。履歴をたどるだけなら上矢印キーを使う。
        lesson: basic-usage
      - term: Ctrl+L
        description: 画面の乱れを直す。
        lesson: basic-usage
      - term: Ctrl+O
        description: 詳細表示を切り替え、ツールの実行内容を確認する。
        lesson: basic-usage
      - term: Ctrl+G
        description: Plan Mode で提案された計画を、既定のテキストエディタで開いて直接修正する。
        lesson: plan-mode
      - term: '@'
        description: ファイルパスの補完を表示する。Tab で確定でき、指定したファイルを Claude に読ませられる。
        lesson: basic-usage
      - term: '!'
        description: 行頭に付けると、シェルコマンドを直接実行して出力をセッションに追加する。行頭以外では効かない。
        lesson: basic-usage
  - id: permission-modes
    title: 権限モード
    items:
      - term: default
        description: 読み取り以外は確認するモード。画面上の呼び名は Manual で、慎重に進めたい作業に向く。
        lesson: permission-modes
      - term: acceptEdits
        description: 作業ディレクトリ内のファイル編集と、mkdir や mv などの基本的なファイル操作を確認なしで行う。それ以外のコマンドは確認される。
        lesson: permission-modes
      - term: plan
        description: 調査と計画の提案だけを行い、計画を承認するまでソースを編集しないモード。
        lesson: plan-mode
      - term: auto
        description: ほぼ全ての操作を確認なしで行い、裏で別のモデルが安全性をチェックする。利用できるかは環境による。
        lesson: permission-modes
      - term: dontAsk
        description: 事前に許可したものだけを実行し、確認が必要な操作は拒否する。Shift+Tab の循環には出ず、CI など人がいない環境向け。
        lesson: permission-modes
      - term: bypassPermissions
        description: 権限確認も安全チェックも外す危険なモード。隔離されたコンテナや VM でだけ使う。
        lesson: permission-modes
      - term: /plan
        description: プロンプトの先頭に付けると、その依頼だけ Plan Mode で計画させる。例は「/plan 認証のバグを直す」。
        lesson: plan-mode
      - term: claude --permission-mode plan
        description: Plan Mode で起動する。plan の部分を変えると、他のモードを指定して起動できる。
        lesson: permission-modes
      - term: permissions.defaultMode
        description: 起動時の権限モードを決める設定ファイルのキー。
        lesson: permission-modes
  - id: cli
    title: 起動オプションと基本コマンド
    items:
      - term: claude
        description: プロジェクトのフォルダで実行し、対話セッションを始める。初回はブラウザでログインを求められる。
        lesson: install
      - term: claude --version
        description: バージョンを表示する。表示されればインストール成功で、表示されなければ PATH を疑う。
        lesson: install
      - term: claude doctor
        description: シェルから実行する診断コマンド。セッションを始めず、インストールと設定の診断を読み取り専用で表示する。
        lesson: troubleshooting
      - term: claude --safe-mode
        description: CLAUDE.md、スキル、プラグイン、hooks、MCP サーバーなどを無効にして起動する。問題が消えれば原因はカスタマイズにある。
        lesson: troubleshooting
      - term: claude --continue
        description: 会話を再開する。作業の区切りで再起動したあとに使う。
        lesson: troubleshooting
      - term: claude --resume
        description: 端末を閉じたあとなどに、同じディレクトリで実行して会話を戻す。
        lesson: troubleshooting
      - term: 'irm https://claude.ai/install.ps1 | iex'
        description: Windows PowerShell でのネイティブインストール。実行中は進捗が出ないので、終わるまで待つ。
        lesson: install
      - term: 'curl -fsSL https://claude.ai/install.sh | bash'
        description: macOS、Linux、WSL でのネイティブインストール。終わったら新しいターミナルを開いて確認する。
        lesson: install
      - term: /login
        description: セッション内でログインし直す、またはアカウントを切り替える。
        lesson: install
      - term: /exit
        description: セッションを終了する。別名は /quit。
        lesson: install
  - id: memory
    title: CLAUDE.md とメモリ
    items:
      - term: '~/.claude/CLAUDE.md'
        description: 全プロジェクト共通の個人設定。
        lesson: claude-md
      - term: ./CLAUDE.md
        description: プロジェクトの基本方針を書き、チームで共有する（Git 管理）。./.claude/CLAUDE.md に置いてもよい。
        lesson: claude-md
      - term: ./CLAUDE.local.md
        description: 個人かつプロジェクト固有の設定。.gitignore に追加してコミットしない。
        lesson: claude-md
      - term: /init
        description: コードベースを調べて CLAUDE.md の下書きを作る。生成後は不要な行を削って整える。
        lesson: claude-md
      - term: /memory
        description: CLAUDE.md の場所の確認と編集、auto memory のオン/オフの切り替え、auto memory フォルダを開く操作ができる。
        lesson: claude-md
      - term: /context
        description: 一覧の Memory files に CLAUDE.md が出ていれば、読み込まれている。指示が無視されるときは最初にここを見る。
        lesson: claude-md
      - term: '@path/to/file'
        description: CLAUDE.md の中に書くと別ファイルを取り込める。ただし起動時に読み込まれるので、コンテキストの節約にはならない。
        lesson: claude-md
      - term: auto memory
        description: Claude 自身があなたの訂正や好みをメモする仕組み。CLAUDE.md はあなたが書き、auto memory は Claude が書く。
        lesson: claude-md
      - term: 200 行未満
        description: CLAUDE.md の長さの目安。長いと指示が守られにくくなるので、具体的で短い指示だけを書く。
        lesson: claude-md
  - id: settings
    title: 設定とhooks
    items:
      - term: '~/.claude/settings.json'
        description: 自分の全プロジェクトに効く個人設定。優先度は最も低い。
        lesson: settings
      - term: .claude/settings.json
        description: プロジェクトの全員に効く設定。Git にコミットして共有する。
        lesson: settings
      - term: .claude/settings.local.json
        description: 自分だけ、そのプロジェクトだけの上書き設定。手で作った場合は .gitignore に自分で追加する。
        lesson: settings
      - term: permissions.allow / ask / deny
        description: 許可・確認・拒否のルール。評価順は deny、ask、allow で、最初に一致したものが採用される。
        lesson: settings
      - term: 'Bash(ls *)'
        description: Bash の権限ルールの書き方。`*` の前の空白に意味があり、ls と ls -la に一致して lsof には一致しない。
        lesson: settings
      - term: hooks
        description: イベント、matcher、実行内容の3段で書く設定キー。必ず実行したい処理や確実に止めたい操作を任せる。
        lesson: settings
      - term: PreToolUse
        description: ツール実行の前に動く hook のイベント。exit 2 で操作を止められる。PostToolUse は実行後なので止められない。
        lesson: settings
      - term: exit 2
        description: hook の終了コード。ブロックできるイベントでは操作を止め、stderr の内容が Claude に返る。exit 1 では止まらない。
        lesson: harness-engineering
      - term: stop_hook_active
        description: Stop hook の入力に入る値。true なら続行中なので、何もせず終了して無限ループを防ぐ。
        lesson: harness-engineering
      - term: env
        description: 設定ファイルのキー。書いた値がセッションとそのサブプロセスの環境変数になる。共有ファイルに秘密は書かない。
        lesson: settings
  - id: extensions
    title: skills・subagents・rules
    items:
      - term: '.claude/skills/<name>/SKILL.md'
        description: プロジェクト用スキルの置き場所。名前のディレクトリを作り、その中に SKILL.md を置く。個人用は ~/.claude/skills/ に置く。
        lesson: skills
      - term: 'disable-model-invocation: true'
        description: スキルの frontmatter。Claude の自動起動を止め、人が /名前 で呼んだときだけ動かす。デプロイなど副作用のある手順向け。
        lesson: skills
      - term: $ARGUMENTS
        description: スキル本文のプレースホルダ。/名前 の後ろに入力した引数がそのまま入る。
        lesson: skills
      - term: allowed-tools
        description: スキルの frontmatter。確認なしで使えるツールを指定する。制限ではないので、制限には disallowed-tools を使う。
        lesson: custom-skill-agent
      - term: '.claude/agents/<name>.md'
        description: サブエージェントの定義ファイル。本文がシステムプロンプトになり、name と description が必須。
        lesson: subagents
      - term: tools
        description: サブエージェントが使えるツールの許可リスト。省略すると、使えるツールをすべて引き継ぐ。
        lesson: subagents
      - term: disallowedTools
        description: サブエージェントの拒否リスト。tools より先に適用される。
        lesson: subagents
      - term: claude --agent
        description: 指定したサブエージェントとして、セッション全体を動かして起動する。
        lesson: subagents
      - term: .claude/rules/
        description: トピックごとの規約を Markdown で置くフォルダ。paths を書かないファイルは起動時に毎回読み込まれる。
        lesson: rules
      - term: paths
        description: rule の frontmatter で Claude Code が読む唯一の項目。glob パターンを書き、一致するファイルを扱うときだけ読み込む。
        lesson: rules
  - id: mcp
    title: MCP
    items:
      - term: 'claude mcp add --transport http <name> <url>'
        description: リモートの HTTP サーバーを追加する。リモートではこの方式が推奨されている。
        lesson: mcp
      - term: 'claude mcp add <name> -- <command> [args...]'
        description: 手元で起動する stdio サーバーを追加する。-- の後ろがそのまま起動コマンドになる。
        lesson: mcp
      - term: --scope
        description: 保存先を local、project、user から選ぶ。既定は local で、チームに共有するなら project を指定する。
        lesson: mcp
      - term: .mcp.json
        description: project スコープのサーバー設定ファイル。Git で共有されるので、秘密は直接書かない。
        lesson: mcp
      - term: '${VAR}'
        description: .mcp.json の command や url などで使える環境変数の展開。秘密の値はこれで渡す。
        lesson: mcp
      - term: claude mcp list
        description: 登録済みサーバーと、Connected や Pending approval などの状態を一覧する。
        lesson: mcp
      - term: claude mcp reset-project-choices
        description: project スコープのサーバーについて、承認や拒否の選択をやり直す。
        lesson: mcp
      - term: /mcp
        description: セッション内で、各サーバーの状態、認証、再接続、無効化を操作する。使っていないサーバーを無効にするのにも使う。
        lesson: cost-context
      - term: disabledMcpjsonServers
        description: .mcp.json のうち読み込みたくないサーバーを入れる設定。claude -p では承認なしで読み込まれるので、その抑制に使う。
        lesson: mcp
      - term: MCP_TIMEOUT
        description: MCP サーバーの起動タイムアウトをミリ秒で調整する環境変数。ツールの実行時間は MCP_TOOL_TIMEOUT で調整する。
        lesson: build-mcp
  - id: automation
    title: ヘッドレス・git・worktree
    items:
      - term: claude -p
        description: 対話画面を開かず、答えを標準出力に出して終了する。成功なら終了コード 0 なのでスクリプトで分岐に使える。
        lesson: headless
      - term: --output-format
        description: 出力形式を text、json、stream-json から選ぶ。json にすると result やセッション ID、コストが取り出せる。
        lesson: headless
      - term: --allowedTools
        description: 確認なしで使わせるツールを権限ルールの構文で指定する。Bash 全体ではなく Bash(git diff *) のように絞る。
        lesson: headless
      - term: --continue / --resume
        description: 非対話でも会話を続ける。--continue は直近の会話、--resume はセッション ID で特定の会話を指す。
        lesson: headless
      - term: 'git log --oneline -20 | claude -p ...'
        description: 標準入力にパイプで渡した内容を読ませる。入力の上限は 10MB。
        lesson: headless
      - term: claude --from-pr
        description: PR に紐づいたセッションを絞り込んで選ぶ。gh pr create で作った PR のセッションに戻れる。
        lesson: git-workflow
      - term: claude --worktree <name>
        description: .claude/worktrees/<name>/ に worktree-<name> ブランチで作業場所を作って起動する。-w でも同じ。
        lesson: worktree
      - term: .worktreeinclude
        description: worktree にコピーする gitignore 済みファイル（.env など）を書く。手動の git worktree add には効かない。
        lesson: worktree
      - term: worktree.baseRef
        description: 新しい worktree の起点を決める設定。既定はリモートの既定ブランチで、head にすると現在の作業から分岐する。
        lesson: parallel-implementation
      - term: git worktree remove
        description: 不要になった worktree を片付ける。フォルダだけ消すと git に登録が残る。
        lesson: worktree
  - id: operations
    title: CI・コスト・チーム運用
    items:
      - term: --bare
        description: hooks、skills、MCP、auto memory、CLAUDE.md の自動読み込みを省く。CI でマシン差を減らすために使い、認証は API キーなどを環境変数で渡す。
        lesson: ci-integration
      - term: --permission-mode dontAsk
        description: 確認が必要な操作をすべて拒否する。人がいない CI に向く。
        lesson: ci-integration
      - term: /install-github-app
        description: GitHub App のインストール、シークレット登録、ワークフローの PR 作成までを案内する。
        lesson: ci-integration
      - term: anthropics/claude-code-action
        description: Claude Code を GitHub Actions に組み込む公式 Action。@claude メンションや prompt 指定で動く。
        lesson: ci-integration
      - term: ANTHROPIC_API_KEY
        description: API キーを渡すシークレット名。コードやログに書かず、GitHub Secrets から渡す。
        lesson: ci-integration
      - term: --max-turns
        description: 反復回数に上限を付けて暴走を防ぐ。ジョブの timeout-minutes と concurrency も併用する。
        lesson: ci-integration
      - term: /usage
        description: セッションのトークン使用量と金額の見積りを表示する。別名は /cost で、請求の正式な値ではない。
        lesson: cost-context
      - term: /effort
        description: 思考量を調整する。簡単な作業で下げると消費を抑えられるが、モデルによってはオフにできない。
        lesson: cost-context
      - term: managed-settings.json
        description: 組織が配布する管理設定のファイル。ユーザー、プロジェクト、コマンドラインのどの設定でも上書きできない。
        lesson: team-operations
      - term: allowManagedPermissionRulesOnly
        description: 権限ルールを管理設定のものだけにする制御キー。hooks と MCP にも、同様に制限するキーがある。
        lesson: team-operations
