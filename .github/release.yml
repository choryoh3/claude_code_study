# =============================================================================
# 自動生成リリースノートの分類
# -----------------------------------------------------------------------------
# 目的:
#   GitHub の Releases で「Generate release notes」を押した（または API で生成した）とき、
#   マージ済み PR をラベルごとに見出しで分類する。手書きのリリースノートを不要にする。
# なぜラベルで分類するのか:
#   ラベルは labeler（自動）と Issue テンプレート・Dependabot（自動）で付くため、
#   人が意識しなくても分類が成立する。
# 評価順:
#   上から順に「最初に一致した」カテゴリに入る。破壊的変更を最上位に置き、見落としを防ぐ。
# 読む主体: GitHub 本体のリリースノート自動生成機能（Actions も Copilot も関与しない）。
# =============================================================================
changelog:
  exclude:
    # リリースノートに載せる価値の低いもの（必要なら外す）。
    labels:
      - skip-changelog
  categories:
    - title: ⚠️ 破壊的変更
      labels:
        - breaking-change
    - title: ✨ 新機能
      labels:
        - enhancement
    - title: 🐛 バグ修正
      labels:
        - bug
    - title: 📝 ドキュメント
      labels:
        - documentation
    - title: 🔧 CI / 開発環境
      labels:
        - ci
        - ai-config
    - title: 📦 依存関係
      labels:
        - dependencies
    # どれにも当てはまらない PR の受け皿。これが無いと PR がノートから漏れる。
    - title: その他の変更
      labels:
        - '*'
