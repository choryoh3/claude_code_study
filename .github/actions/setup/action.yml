# =============================================================================
# 共通セットアップ（composite action）
# -----------------------------------------------------------------------------
# 目的:
#   「チェックアウト後にランタイムと依存関係を入れる」手順を 1 か所に集約する。
# なぜ:
#   ci.yml / copilot-setup-steps.yml など複数のワークフローに同じ手順をコピーすると、
#   Node のバージョンやキャッシュ設定が少しずつズレて
#   「CI では通るのに Copilot の作業環境では落ちる」といった不一致が起きる。
#   ここを唯一の定義にすれば、変更は 1 ファイルで済み、レビューも 1 か所で済む。
# 使い方:
#   - uses: actions/checkout@...      # 先にチェックアウトが必要（`./` はワークスペース内を参照するため）
#   - uses: ./.github/actions/setup
# 他プロジェクトへの応用:
#   言語が違う場合は steps だけ差し替える。呼び出し側のワークフローは変更不要。
#     Python: actions/setup-python + `uv sync --frozen`
#     Go    : actions/setup-go（go.mod からバージョン取得）+ `go mod download`
#     Java  : actions/setup-java（cache: gradle / maven）
# 実行主体: GitHub Actions（呼び出し元のワークフローのジョブ内で、ステップとして実行される）。単体では動かない。
# =============================================================================
name: Setup
description: Node.js と pnpm をセットアップし、依存関係をインストールする

inputs:
  install:
    # 依存のインストールを省略したいジョブ（例: ランタイムだけ必要な軽量ジョブ）向けのスイッチ。
    # composite action の inputs は常に文字列なので 'true' / 'false' で比較する。
    description: "依存関係をインストールするか（'true' / 'false'）"
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # pnpm を setup-node より「先に」入れる。
    # setup-node の `cache: pnpm` は pnpm コマンドでストアの場所を調べるため、
    # pnpm が PATH に無いと失敗する。順序に意味があるので入れ替えないこと。
    #
    # version を指定していないのは意図的。package.json の "packageManager" を読ませ、
    # ローカル（corepack）と CI の pnpm バージョンを 1 つの情報源で一致させる。
    #
    # uses はタグではなくコミット SHA で固定する（サプライチェーン対策）。
    # タグは後から別コミットに付け替えられるため、乗っ取られた action に
    # 悪意あるコードを差し込まれても気付けない（2025 年の tj-actions 事件が実例）。
    # 末尾の `# vX.Y.Z` は人間向けの注記で、Dependabot が SHA と一緒に自動更新する。
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # Node のバージョンは .node-version から読む（ワークフローに直書きしない）。
    # なぜ: nvm / fnm / mise / Volta などローカルのバージョンマネージャーも同じファイルを読めるため、
    #       「ローカルは 24、CI は 22」のようなズレを防げる。
    # cache: pnpm で pnpm ストアを Actions キャッシュに保存し、2 回目以降の install を高速化する。
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm

    # --frozen-lockfile: lockfile と package.json が食い違っていたら失敗させる。
    # なぜ: CI がこっそり lockfile を書き換えて「ローカルと違う依存」で検証するのを防ぐ。
    #       lockfile の更新漏れを PR の段階で検出できる。
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
